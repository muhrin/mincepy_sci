[build-system]
requires = ['flit_core >=3.9,<4']
build-backend = 'flit_core.buildapi'

[project]
name = "mincepy-sci"
dynamic = ["version"]
description = "Plugins to enable common scientific and machine learning type to be saved by mincePy"
readme = "README.rst"
license = { file = 'LICENSE.txt' }
authors = [
    { name = "Martin Uhrin", email = "martin.uhrin.10@ucl.ac.uk" },
]
keywords = [
    "concurrent",
    "database",
    "nosql",
    "object-store",
    "optimistic-locking",
    "orm",
    "schemaless",
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
requires-python = '>=3.11'
dependencies = [
    "bidict",
    "mincepy>=0.19.1, <0.20",
    "typing-extensions",  # For typing.override on Python < 3.12
]

[project.optional-dependencies]
dev = [
    "flit_core",
    "pip",
    "pre-commit",
    "pytest-cov",
    "pytest>4",
    "pyyaml",
    "ruff",
    "ty==0.0.89",  # Pinned as new releases add checks
]
full = [
    "ase",
    "e3nn",
    "flax",
    "jax",
    "numpy",
    "pandas",
    "plams",
    "pyilt22",
    "pymatgen",
    "rdkit",
    "torch",
]

[project.entry-points."mincepy.plugins.types"]
mincepy_sci = "mincepy_sci.provides:get_types"

[project.urls]
Homepage = "https://github.com/muhrin/mincepy_sci"
Issues = "https://github.com/muhrin/mincepy_sci/issues"

[tool.flit.module]
name = 'mincepy_sci'

[tool.flit.sdist]
exclude = [
    '.github/',
    'docs/',
    'examples/',
    'test/',
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle and pyflakes
    "C90",  # mccabe complexity
    "I",  # isort
    "FLY",  # flynt
    "UP009",  # no utf-8 encoding declarations
    "A",  # shadowing builtins
    "B",  # bugbear: likely bugs and design problems
    "PL",  # pylint
]
ignore = [
    "E501",  # line length is handled by the formatter
    "F401",
    "F403",
    "PLC0415",  # imports outside top level are used to avoid circular imports
    "PLR2004",  # magic value comparisons
    "PLW1641",  # __eq__ without __hash__ (Python already makes these unhashable)
]

[tool.ruff.lint.per-file-ignores]
# Tests import optional packages after pytest.importorskip() so that they are skipped without them
"test/*" = ["E402"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["type", "id"]

[tool.ruff.lint.pylint]
# The previous pylint settings
max-args = 10
max-locals = 20

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "test"]
# Files that do not pass ty yet.  Please remove files from this list as they are fixed so that
# they are checked from then on, the aim being to remove the list altogether.
exclude = [
    "src/mincepy_sci/ase_types.py",
    "src/mincepy_sci/e3nn_types.py",
    "src/mincepy_sci/flax_types.py",
    "src/mincepy_sci/jax_types.py",
    "src/mincepy_sci/numpy_types.py",
    "src/mincepy_sci/plams_types.py",
    "src/mincepy_sci/pymatgen_types.py",
    "src/mincepy_sci/pytorch_types.py",
    "src/mincepy_sci/rdkit_types.py",
    "test/test_e3nn.py",
    "test/test_pytorch.py",
    "test/test_rdkit_types.py",
]
